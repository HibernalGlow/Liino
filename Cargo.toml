[workspace]
resolver = "3"
members = [
    "cli",
    "crates/arboard-shim",
    "crates/liino-audio-core",
    "crates/liino-core",
    "crates/liino-daemon",
    "crates/liino-engine",
    "crates/liino-infer",
    "crates/liino-platform",
    "crates/liino-protocol",
    "packages/core",
    "packages/liino_api",
    "packages/localsend_isolates/rust",
    "server",
]
# Vendored MicYou crates belong to their own workspace and are consumed as path
# dependencies only (see docs/migration/upstream-reuse.md).
exclude = ["vendor"]

# Profiles are only honored in the workspace root manifest.

# Full debuginfo dominates target/ size; line tables keep backtraces usable.
[profile.dev]
debug = "line-tables-only"

# RSA key generation is bignum-heavy and takes ~10x longer unoptimized;
# keep the crypto crates optimized in dev so tests stay fast.
[profile.dev.package.rsa]
opt-level = 2

[profile.dev.package.num-bigint-dig]
opt-level = 2

# MicYou's core only uses arboard for its plugin clipboard API; the real crate
# has no Android backend. liino does not expose it, so a no-op shim keeps the
# Android build possible without patching the upstream submodule.
[patch.crates-io]
arboard = { path = "crates/arboard-shim" }
