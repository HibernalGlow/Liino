[package]
name = "liino_api"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dependencies]
flutter_rust_bridge = { version = "=2.12.0" }
liino-core = { path = "../../crates/liino-core" }
# Vendored MicYou core is used directly (no copies); see docs/migration/upstream-reuse.md.
micyou-core = { path = "../../vendor/micyou/tauri-app/crates/micyou-core", default-features = false }
# Sender client: microphone capture (cpal) + protobuf wire framing (prost).
cpal = "0.18.2"
prost = "0.14"
