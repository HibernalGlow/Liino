name: liino_api
description: Flutter Rust Bridge bindings for liino-core
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # Must match flutter_rust_bridge_codegen (2.12.0) used for the checked-in bindings;
  # FRB refuses to initialize when codegen and runtime versions differ.
  flutter_rust_bridge: 2.12.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
