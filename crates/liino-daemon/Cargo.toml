[package]
name = "liino-daemon"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Standalone desktop background host, IPC server, and GUI process coordinator for liino"

[dependencies]
liino-core = { path = "../liino-core" }
liino-engine = { path = "../liino-engine" }
liino-platform = { path = "../liino-platform" }
micyou-core = { path = "../../vendor/micyou/tauri-app/crates/micyou-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
