output: dist/

# Linux-only on purpose. macOS and Windows are packaged by the build-macos and
# build-windows jobs in .github/workflows/release.yml instead of by a
# flutter_distributor maker here, because every maker for those two platforms
# needs extra tooling the Linux jobs don't (create-dmg, Inno Setup, ...) and
# each one has to run on its own OS. Those jobs do the two things a plain
# `flutter build` gets wrong on desktop:
#
#   macOS  - archive with `ditto`, since the embedded libmpv.framework is a
#            symlink farm that a normal zip corrupts
#   Windows - assert libmpv.dll landed next to the executable, which is the
#            download-and-bundle step in mpv_audio_kit's CMakeLists
releases:
  - name: dev
    display_name: Looper Player
    jobs:
      - name: linux-deb
        package:
          platform: linux
          target: deb
        # Override the package name specifically for Debian to satisfy the hyphen rule
        # while keeping the internal project name as looper_player for Dart compatibility.
        maker_config:
          package_name: looper-player
        build_args:
          --release:

      - name: linux-rpm
        package:
          platform: linux
          target: rpm
        build_args:
          --release:

      - name: linux-appimage
        package:
          platform: linux
          target: appimage
        build_args:
          --release:

      - name: linux-archive
        package:
          platform: linux
          target: archive
        build_args:
          --release:

