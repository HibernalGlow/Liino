name: Secure Build, Signing, and Unified CI Release Pipeline

# What runs when
# --------------
# pull_request            -> test only. A 30-second gate on analyze, formatting
#                            and the regression suite; the platform builds are
#                            not worth the runner minutes on every PR.
# push tag v*             -> test, build-macos, build-windows, publish-release.
#                            macOS and Windows are the desktop targets this
#                            repository ships.
# workflow_dispatch       -> the same desktop builds, for a dry run.
#
# Android and Linux packaging stay defined but are OFF by default: the Android
# job needs a signing keystore and a Play-flavor secret this fork does not
# carry, and Linux packaging needs flutter_distributor plus an apt toolchain.
# A tag push must not fail because of either. Set the repository variables
# RELEASE_ANDROID / RELEASE_LINUX to "true" in Settings -> Secrets and
# variables -> Actions -> Variables to bring them back for a release.

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Static analysis and the pure-Dart regression suite. Cheap, runs first, and
  # is the only job a pull request needs - a broken analyze/test fails here
  # instead of somewhere deep inside a packaging step.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned rather than 'stable'. Both the formatter and the analyzer
          # move with the SDK, and this workflow gates a release on them -
          # 3.47.4 is the toolchain the desktop port was built, formatted and
          # tested against, so a green run here means the same thing a green
          # local run does.
          flutter-version: '3.47.4'
          cache: true

      - name: Install dependencies
        run: |
          # appambit_sdk_flutter 1.2.0 declares
          # `pluginClass: AppAmbitSdkFlutterPlugin` - which does match the class
          # inside the file - but names the file AppambitSdkFlutterPlugin.kt.
          # flutter_tools' Android plugin validation looks for a file named
          # after pluginClass, case-sensitively, and aborts `pub get` when it is
          # absent. So this only fails on a case-sensitive filesystem, which is
          # why it never reproduced on the macOS or Windows runners (APFS and
          # NTFS are not case-sensitive) and why it is fixed here and not there.
          #
          # Renaming the file is the whole fix: Kotlin does not require the two
          # to match, and the generated Android registrant then names a class
          # that really exists. The first run is what downloads the package, so
          # it is expected to fail; the second resolves everything. Drop both
          # once the package is fixed upstream.
          flutter pub get || true
          plugin_dir="$HOME/.pub-cache/hosted/pub.dev/appambit_sdk_flutter-1.2.0/android/src/main/kotlin/com/appambit/appambit_sdk_flutter"
          if [ -f "$plugin_dir/AppambitSdkFlutterPlugin.kt" ] && [ ! -e "$plugin_dir/AppAmbitSdkFlutterPlugin.kt" ]; then
            mv "$plugin_dir/AppambitSdkFlutterPlugin.kt" "$plugin_dir/AppAmbitSdkFlutterPlugin.kt"
          fi
          flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    if: ${{ vars.RELEASE_ANDROID == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned rather than 'stable'. Both the formatter and the analyzer
          # move with the SDK, and this workflow gates a release on them -
          # 3.47.4 is the toolchain the desktop port was built, formatted and
          # tested against, so a green run here means the same thing a green
          # local run does.
          flutter-version: '3.47.4'
          cache: true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> android/key.properties

      - name: Install dependencies
        run: |
          # appambit_sdk_flutter 1.2.0 declares
          # `pluginClass: AppAmbitSdkFlutterPlugin` - which does match the class
          # inside the file - but names the file AppambitSdkFlutterPlugin.kt.
          # flutter_tools' Android plugin validation looks for a file named
          # after pluginClass, case-sensitively, and aborts `pub get` when it is
          # absent. So this only fails on a case-sensitive filesystem, which is
          # why it never reproduced on the macOS or Windows runners (APFS and
          # NTFS are not case-sensitive) and why it is fixed here and not there.
          #
          # Renaming the file is the whole fix: Kotlin does not require the two
          # to match, and the generated Android registrant then names a class
          # that really exists. The first run is what downloads the package, so
          # it is expected to fail; the second resolves everything. Drop both
          # once the package is fixed upstream.
          flutter pub get || true
          plugin_dir="$HOME/.pub-cache/hosted/pub.dev/appambit_sdk_flutter-1.2.0/android/src/main/kotlin/com/appambit/appambit_sdk_flutter"
          if [ -f "$plugin_dir/AppambitSdkFlutterPlugin.kt" ] && [ ! -e "$plugin_dir/AppAmbitSdkFlutterPlugin.kt" ]; then
            mv "$plugin_dir/AppambitSdkFlutterPlugin.kt" "$plugin_dir/AppAmbitSdkFlutterPlugin.kt"
          fi
          flutter pub get

      # The GitHub-release APKs use the `github` flavor: it checks GitHub for
      # updates and contains no Google Play code. The Play Store AAB (`play`
      # flavor) is built separately with `./package.sh android --build`.
      - name: Build Android Release APK
        run: flutter build apk --release --flavor github --split-per-abi

      # Flutter's Gradle plugin names split APKs app-<abi>-<flavor>-release.apk
      # (ABI before flavor); the other order is accepted too so a tooling change
      # can't silently drop an APK. The job fails, listing what was built, if
      # one is missing.
      - name: Rename and Prepare APKs
        run: |
          mkdir -p build/release-assets
          dir=build/app/outputs/flutter-apk
          ls -1 "$dir"/*.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src=""
            for f in "$dir/app-${abi}-github-release.apk" "$dir/app-github-${abi}-release.apk"; do
              if [ -f "$f" ]; then src="$f"; break; fi
            done
            if [ -z "$src" ]; then
              echo "::error::No $abi APK found in $dir (see listing above)"
              exit 1
            fi
            cp "$src" "build/release-assets/looper-player-${abi}.apk"
          done

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/release-assets/*.apk

  build-linux:
    if: ${{ vars.RELEASE_LINUX == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [test]
    runs-on: ubuntu-latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            libgcrypt20-dev libmpv-dev libnotify-dev \
            rpm

      - name: Install appimagetool for AppImage Packaging
        run: |
          sudo wget -q -O /usr/local/bin/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned rather than 'stable'. Both the formatter and the analyzer
          # move with the SDK, and this workflow gates a release on them -
          # 3.47.4 is the toolchain the desktop port was built, formatted and
          # tested against, so a green run here means the same thing a green
          # local run does.
          flutter-version: '3.47.4'
          cache: true

      - name: Enable Linux Platform Support
        run: flutter config --enable-linux-desktop

      - name: Install Flutter Distributor
        run: flutter pub global activate flutter_distributor

      - name: Add Pub global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install Project Dependencies
        run: |
          # appambit_sdk_flutter 1.2.0 declares
          # `pluginClass: AppAmbitSdkFlutterPlugin` - which does match the class
          # inside the file - but names the file AppambitSdkFlutterPlugin.kt.
          # flutter_tools' Android plugin validation looks for a file named
          # after pluginClass, case-sensitively, and aborts `pub get` when it is
          # absent. So this only fails on a case-sensitive filesystem, which is
          # why it never reproduced on the macOS or Windows runners (APFS and
          # NTFS are not case-sensitive) and why it is fixed here and not there.
          #
          # Renaming the file is the whole fix: Kotlin does not require the two
          # to match, and the generated Android registrant then names a class
          # that really exists. The first run is what downloads the package, so
          # it is expected to fail; the second resolves everything. Drop both
          # once the package is fixed upstream.
          flutter pub get || true
          plugin_dir="$HOME/.pub-cache/hosted/pub.dev/appambit_sdk_flutter-1.2.0/android/src/main/kotlin/com/appambit/appambit_sdk_flutter"
          if [ -f "$plugin_dir/AppambitSdkFlutterPlugin.kt" ] && [ ! -e "$plugin_dir/AppAmbitSdkFlutterPlugin.kt" ]; then
            mv "$plugin_dir/AppambitSdkFlutterPlugin.kt" "$plugin_dir/AppAmbitSdkFlutterPlugin.kt"
          fi
          flutter pub get

      - name: Package Linux Distributors (DEB, RPM, AppImage, Archive)
        run: |
          flutter_distributor release --name dev --package linux-deb
          flutter_distributor release --name dev --package linux-rpm
          flutter_distributor release --name dev --package linux-appimage
          flutter_distributor release --name dev --package linux-archive

      - name: Organize Linux Distribution Artifacts
        run: |
          mkdir -p build/linux-release-assets
          find dist/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.tar.gz" \) -exec cp {} build/linux-release-assets/ \;
          ls -la build/linux-release-assets/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: build/linux-release-assets/*

  # macOS builds must happen on macOS: the Runner is an Xcode project and the
  # libmpv.xcframework the audio engine links is downloaded and embedded by
  # CocoaPods, neither of which can be cross-compiled.
  #
  # Note the entitlements check below. A Debug build succeeding says nothing
  # about Release - the Release configuration strips the JIT and (previously)
  # the network entitlements, so the "works in dev, no lyrics in the shipped
  # app" failure is the expected one to guard against.
  build-macos:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs: [test]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned rather than 'stable'. Both the formatter and the analyzer
          # move with the SDK, and this workflow gates a release on them -
          # 3.47.4 is the toolchain the desktop port was built, formatted and
          # tested against, so a green run here means the same thing a green
          # local run does.
          flutter-version: '3.47.4'
          cache: true

      - name: Enable macOS Platform Support
        run: flutter config --enable-macos-desktop

      - name: Install Project Dependencies
        # Deliberately no workaround here - see the Linux jobs' comment. This
        # runner's filesystem is case-insensitive, so flutter_tools' plugin
        # validation finds the file and pub get succeeds first time.
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      # Every entitlement the shipped app cannot work without. A release whose
      # network client or music-folder access has been silently dropped would
      # otherwise install and launch fine, then fail on first use.
      - name: Verify Release Entitlements
        run: |
          app="build/macos/Build/Products/Release/looper_player.app"
          if [ ! -d "$app" ]; then
            echo "::error::No macOS app bundle at $app"
            exit 1
          fi
          codesign -d --entitlements :- "$app" > /tmp/entitlements.plist
          cat /tmp/entitlements.plist
          for key in \
            com.apple.security.network.client \
            com.apple.security.files.user-selected.read-only \
            com.apple.security.assets.music.read-only; do
            if ! grep -q "$key" /tmp/entitlements.plist; then
              echo "::error::Release is missing $key - see macos/Runner/Release.entitlements"
              exit 1
            fi
          done

      - name: Package macOS App
        run: |
          mkdir -p build/macos-release-assets
          # The embedded libmpv.framework is a symlink farm, so a plain zip
          # breaks it - ditto is the only archiver that preserves it.
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/looper_player.app \
            build/macos-release-assets/looper-player-macos.zip
          ls -la build/macos-release-assets/

      - name: Package macOS App
        run: |
          mkdir -p build/macos-release-assets
          # The embedded libmpv.framework is a symlink farm, so a plain zip
          # breaks it - ditto is the only archiver that preserves it.
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/looper_player.app \
            build/macos-release-assets/looper-player-macos.zip
          ls -la build/macos-release-assets/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: build/macos-release-assets/*

  # Windows needs the "Desktop development with C++" workload, which the
  # windows-latest image already carries. mpv_audio_kit downloads and bundles
  # libmpv.dll during the CMake configure step, so the zip below is what
  # actually ships - a missing DLL is the classic "starts on the build machine
  # only" failure, hence the explicit check.
  build-windows:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs: [test]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned rather than 'stable'. Both the formatter and the analyzer
          # move with the SDK, and this workflow gates a release on them -
          # 3.47.4 is the toolchain the desktop port was built, formatted and
          # tested against, so a green run here means the same thing a green
          # local run does.
          flutter-version: '3.47.4'
          cache: true

      - name: Enable Windows Platform Support
        run: flutter config --enable-windows-desktop

      - name: Install Project Dependencies
        # Deliberately no workaround here - see the Linux jobs' comment. This
        # runner's filesystem is case-insensitive, so flutter_tools' plugin
        # validation finds the file and pub get succeeds first time.
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Verify Bundled Native Libraries
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          if (-not (Test-Path $release)) {
            Write-Error "No Windows release output at $release"
            exit 1
          }
          Get-ChildItem $release | Format-Table Name, Length
          if (-not (Test-Path "$release\libmpv-2.dll") -and -not (Test-Path "$release\libmpv.dll")) {
            Write-Error "libmpv not bundled next to the executable - see windows/flutter/ephemeral/.plugin_symlinks/mpv_audio_kit"
            exit 1
          }

      - name: Package Windows Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\windows-release-assets | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath build\windows-release-assets\looper-player-windows-x64.zip -Force
          Get-ChildItem build\windows-release-assets | Format-Table Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: build/windows-release-assets/*

  publish-release:
    # Only the two desktop targets gate the release. Android and Linux are
    # downloaded when they exist, but a release that ships macOS and Windows
    # should not be held back by a job that was skipped.
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-binaries

      - name: Download Linux Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-binaries

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-packages
          path: release-binaries

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-binaries

      - name: List Downloaded Binaries
        run: ls -lh release-binaries

      - name: Generate Premium Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"

          # Create automated premium release notes using GitHub CLI
          gh release create "$TAG_NAME" \
            release-binaries/* \
            --title "Looper Player $TAG_NAME" \
            --notes "### 🚀 Welcome to Looper Player $TAG_NAME!
            
            This release is the first with native **macOS** and **Windows** desktop support, built through the automated CI/CD pipelines.
            
            #### 📱 Platforms Supported
            - **macOS**: Native \`.app\` bundle, archived with \`ditto\` so the embedded libmpv framework survives the round trip. Sandboxed with the network, user-selected-folder and Music-library entitlements the player needs.
            - **Windows**: 64-bit desktop archive containing the executable and its bundled \`libmpv\` runtime.
            
            #### 🆕 Desktop changes in this release
            - Each desktop now resolves its own music folder: \`~/Music\` on macOS (unwrapping the App Sandbox container), the profile library plus a redirected OneDrive one on Windows, \`xdg-user-dir\` on Linux. No desktop falls back to an Android storage path any more.
            - Embedded lyrics work out of the box on Windows and macOS: the ID3v2 SYLT and USLT frames are decoded in pure Dart, so no ffprobe and no native reader are required. ffprobe is still used as a fallback when it is installed.
            - Directory containment checks use the platform's own separator, so a backslash-separated Windows path finally matches its own children.
            - Desktop layout, full-screen lyrics and the Fluid Player switch are keyed off \"is this a desktop\" rather than \"is this Linux\".
            
            ---
            *Looper Player is 100% offline-first, private, and telemetry-free. Enjoy your local high-fidelity audio with beautifully synchronized interactive lyrics.*"
